name: Stage presentation
on:
  push:
    branches: ['report/stage-2026-11-17']
    paths: ['docs/reports/build_stage_report.py', '.github/workflows/stage-presentation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: report/stage-2026-11-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install presentation and app tools
        run: |
          python -m pip install -r backend/requirements.txt python-pptx pillow pytest httpx
          npm --prefix frontend ci
          npm --prefix frontend run build
          cd frontend
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress fonts-noto-cjk poppler-utils
      - name: Build and verify presentation
        run: python docs/reports/build_stage_report.py
      - name: Upload presentation bundle
        uses: actions/upload-artifact@v4
        with:
          name: Zhiyu-Stage-Report-2026-11-17
          path: docs/reports/2026-11-17/output/
          retention-days: 90
      - name: Save final files on report branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/2026-11-17/output/
          git diff --cached --quiet || git commit -m 'docs: add rendered stage presentation and project screenshots'
          git push origin HEAD:report/stage-2026-11-17
