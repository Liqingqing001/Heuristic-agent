name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx
      - name: Check knowledge points
        working-directory: backend
        run: python scripts/check_kp.py --strict
      - name: Run API tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend
          npx playwright install --with-deps chromium
      - name: Browser regression tests
        env:
          APP_DB_PATH: ${{ runner.temp }}/ui-regression.db
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/ui-server.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          cd ../frontend
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Backend did not become ready')
          PY
          npm run test:e2e
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7
